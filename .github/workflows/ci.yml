name: CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Prepare runtime
        run: node scripts/prepare-runtime.mjs
      - name: Build Harness bundle
        run: node scripts/build-harness-plugin.mjs
      # 只运行本地回归测试，不启动桌面窗口，也不调用真实Codex模型。
      - name: Run tests
        run: npm test

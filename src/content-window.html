<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Codex Pet · Content</title><link rel="stylesheet" href="panel-theme.css"><link rel="stylesheet" href="content-window.css"><script defer src="locale-en.cjs"></script><script defer src="codex-locale.cjs"></script><script defer src="panel-navigation.js"></script><script defer src="content-window.js"></script></head>
<body data-panel="content"><main>
 <div class="operations"><label class="profile-choice"><span data-text="activity">Activity</span><select id="profile"></select></label><button id="new" data-text="new">New activity</button><button id="refresh" data-text="refresh">Refresh</button><button id="save" class="primary" data-text="save">Save</button><button id="remove" class="danger" data-text="remove">Remove</button></div>
 <p id="status" role="status" aria-live="polite"></p>
 <div class="content-layout"><form id="settings" class="settings">
  <div class="fields"><label><span data-text="name">Name</span><input id="label" maxlength="80" required></label><label><span data-text="platform">Platform</span><select id="platform"></select></label><label><span data-text="host">Assistant</span><select id="host"><option value="codex">Codex</option><option value="workbuddy">WorkBuddy</option><option value="harness">DeepSeek Harness</option></select></label><label class="check"><input id="enabled" type="checkbox"><span data-text="enabled">Enabled</span></label></div>
  <fieldset><legend data-text="source">Content service</legend><label id="connection-field"><span data-text="method">Read through</span><select id="method"><option value="mcp" data-text="selectedService">Selected service</option><option value="rss" data-text="subscription">RSS subscription</option><option value="api" data-text="accountApi">Account API</option><option value="obs">OBS</option></select></label><div id="mcp-fields"><div class="source-row"><label><span data-text="service">Service</span><select id="server"></select></label><button type="button" id="source-refresh" data-text="sourceRefresh">Read app settings</button><button type="button" id="source-choose" data-text="sourceChoose">Choose configuration</button></div><p class="meta" id="source-state"></p></div><label id="rss-field" hidden><span data-text="feedUrl">Subscription address</span><input id="rss-url" type="url" maxlength="4096"></label><div id="api-fields" class="fields" hidden><p id="api-scope" class="meta"></p><label><span data-text="accessToken">Access token</span><input id="api-token" type="password" maxlength="8192" autocomplete="new-password"></label><label id="api-key-field"><span data-text="apiKey">API key</span><input id="api-key" type="password" maxlength="8192" autocomplete="new-password"></label><label id="api-user-field"><span data-text="accountId">Account ID</span><input id="api-user" maxlength="160"></label><label id="api-client-field"><span data-text="clientId">Client ID</span><input id="api-client" maxlength="160"></label><label id="api-board-field"><span data-text="boardId">Board ID</span><input id="api-board" maxlength="160"></label><label id="api-subreddit-field"><span>Subreddit</span><input id="api-subreddit" maxlength="32"></label></div><div id="obs-fields" hidden><label><span data-text="obsPassword">OBS WebSocket password</span><input id="obs-password" type="password" maxlength="1024" autocomplete="new-password"></label></div></fieldset>
  <fieldset><legend data-text="browse">Browse</legend><div class="fields"><label><span data-text="action">Action</span><select id="read-action"></select></label><label id="query-field"><span data-text="query">Search</span><input id="query" maxlength="2048"></label><label id="recipient-field"><span data-text="recipient">Account</span><input id="recipient" maxlength="160"></label><label id="item-field"><span data-text="item">Post or video ID</span><input id="item" maxlength="160"></label><label id="room-field"><span data-text="roomId">Live room ID</span><input id="room" maxlength="256"></label><label id="url-field"><span data-text="url">Post or room link</span><input id="url" type="url" maxlength="4096"></label></div><div class="checks" id="enrichment"></div></fieldset>
  <fieldset><legend data-text="permissions">Interactions</legend><div class="checks" id="permissions"></div></fieldset>
  <fieldset><legend data-text="schedule">Schedule and limits</legend><label class="check"><input id="scheduled" type="checkbox"><span data-text="scheduled">Run on a schedule</span></label><div class="fields limits"><label><span data-text="interval">Every (minutes)</span><input id="interval" type="number" min="5" max="10080" value="60"></label><label><span data-text="startHour">From (hour)</span><input id="start-hour" type="number" min="0" max="23" value="0"></label><label><span data-text="endHour">Until (hour)</span><input id="end-hour" type="number" min="1" max="24" value="24"></label><label><span data-text="dailyRuns">Runs per day</span><input id="daily-runs" type="number" min="1" max="200" value="10"></label><label><span data-text="maxItems">Items per run</span><input id="max-items" type="number" min="1" max="50" value="5"></label><label><span data-text="modelCalls">Analyses per day</span><input id="model-calls" type="number" min="1" max="200" value="10"></label><label><span data-text="mediaSeconds">Media seconds</span><input id="media-seconds" type="number" min="1" max="120" value="30"></label><label><span data-text="frames">Frame samples</span><input id="frames" type="number" min="1" max="12" value="3"></label></div><div class="checks"><label class="check"><input id="analyze" type="checkbox" checked><span data-text="analyze">Let the character reflect on it</span></label><label class="check"><input id="dedupe" type="checkbox" checked><span data-text="dedupe">Skip previously read posts</span></label></div></fieldset>
  <label class="check"><input id="share" type="checkbox"><span data-text="shareOwner">Share with my paired QQ account</span></label>
  <details><summary data-text="toolMapping">Custom service mapping</summary><textarea id="bindings" rows="5" spellcheck="false" aria-label="Service mapping"></textarea></details>
  <details id="broadcast-editor"><summary data-text="broadcast">AI host session</summary><div class="broadcast-fields">
   <label class="check"><input id="broadcast-enabled" type="checkbox"><span data-text="broadcastEnabled">Enable host sessions</span></label>
   <div class="fields"><label><span data-text="broadcastSource">Live chat activity</span><select id="broadcast-source"></select></label><label><span>OBS</span><select id="broadcast-obs"></select></label><label><span data-text="captionSource">OBS text source</span><select id="broadcast-caption"></select></label><button type="button" id="broadcast-sources" data-text="readSources">Read text sources</button></div>
   <label><span data-text="publicPersona">Public persona</span><textarea id="broadcast-persona" rows="3" maxlength="2000"></textarea></label>
   <div class="checks"><label class="check"><input id="broadcast-voice-enabled" type="checkbox"><span data-text="systemVoice">Play system voice</span></label><button type="button" id="broadcast-voices" data-text="readVoices">Read system voices</button></div><label><span data-text="voice">Voice</span><select id="broadcast-voice"></select></label>
   <div class="fields"><label><span data-text="cycles">Maximum cycles</span><input id="broadcast-cycles" type="number" min="1" max="20" value="3"></label><label><span data-text="minutes">Maximum minutes</span><input id="broadcast-minutes" type="number" min="1" max="30" value="5"></label><label><span data-text="intervalSeconds">Interval (seconds)</span><input id="broadcast-interval" type="number" min="5" max="300" value="15"></label><label><span data-text="sessionModelCalls">Analyses per session</span><input id="broadcast-model-calls" type="number" min="1" max="20" value="3"></label><label><span data-text="modelCalls">Analyses per day</span><input id="broadcast-daily-model" type="number" min="1" max="100" value="10"></label><label><span data-text="replyLength">Reply character limit</span><input id="broadcast-reply-length" type="number" min="40" max="800" value="160"></label></div>
   <div class="run-row"><button type="button" id="broadcast-save" data-text="saveSession">Save session settings</button><button type="button" id="broadcast-start" class="primary" data-text="startSession">Start session</button><button type="button" id="broadcast-pause" data-text="pause">Pause</button><button type="button" id="broadcast-resume" data-text="resume">Resume</button><button type="button" id="broadcast-cancel" data-text="endSession">End session</button></div><p id="broadcast-status" class="meta" role="status"></p><ul id="broadcast-jobs" class="job-list"></ul>
  </div></details>
  <div class="run-row"><select id="run-action" aria-label="Activity action"></select><button id="run" class="primary" type="button" data-text="run">Run now</button><button id="cancel" type="button" data-text="cancel">Cancel activity</button></div><label id="write-field" hidden><span data-text="message">Message</span><textarea id="write-text" rows="3" maxlength="12000"></textarea></label>
 </form><section class="results"><ul id="jobs" class="job-list"></ul><p id="empty" class="empty" data-text="empty">No activities yet.</p><section id="result" hidden><dl id="metadata"></dl><p id="result-state" class="meta"></p><pre id="output" tabindex="0"></pre><details><summary data-text="materials">Sources and materials</summary><pre id="materials" tabindex="0"></pre></details></section></section></div>
</main></body></html>

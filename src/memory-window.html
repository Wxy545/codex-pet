<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
 <title>Codex Pet · Memory</title>
 <link rel="stylesheet" href="panel-theme.css"><link rel="stylesheet" href="memory-window.css">
 <script defer src="locale-en.cjs"></script><script defer src="codex-locale.cjs"></script><script defer src="panel-navigation.js"></script><script defer src="memory-window.js"></script>
</head>
<body data-panel="memory">
 <main>
  <form id="memory-search" class="operations">
   <label class="scope-field"><span data-memory-text="scope">Memory scope</span><select id="scope" disabled></select></label>
   <label class="query-field"><span data-memory-text="query">Search memories</span><input id="query" maxlength="2048" autocomplete="off"></label>
   <div class="search-actions"><button type="submit" id="search" class="primary" data-memory-text="search">Search</button><button type="button" id="reset" data-memory-text="reset">Reset</button><button type="button" id="refresh" data-memory-text="refresh">Refresh</button></div>
   <label class="retention-field"><span data-memory-text="retention">Keep for</span><select id="retention"><option value="" data-memory-text="forever">Until deleted</option><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option><option value="365">365 days</option></select></label>
   <button type="button" id="save-retention" data-memory-text="saveRetention">Save period</button><button type="button" id="export" data-memory-text="export">Export JSON</button><button type="button" id="clear" class="danger" data-memory-text="clear">Clear scope</button>
  </form>
  <form id="role-settings" class="operations role-settings">
   <label><span data-memory-text="roleHost">App</span><select id="role-host"><option value="codex">Codex</option><option value="workbuddy">WorkBuddy</option><option value="harness">DeepSeek Harness</option></select></label>
   <label><span data-memory-text="qqMode">QQ default mode</span><select id="qq-mode"><option value="task" data-memory-text="taskMode">Tasks</option><option value="role" data-memory-text="roleMode">Companion chat · no tools</option></select></label>
   <label class="sharing-choice"><input type="checkbox" id="share-memory"><span data-memory-text="shareOwner">Share my QQ and desktop memories</span></label>
   <button type="submit" id="save-role" data-memory-text="saveRole">Save chat settings</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div class="memory-content">
   <section class="list-region" aria-label="Memories" id="list-region">
    <p id="empty" class="empty" data-memory-text="empty">No memories in this scope.</p><ul id="memories" class="memory-list"></ul><button id="more" type="button" hidden data-memory-text="more">Load more</button>
   </section>
   <section class="detail-region" id="detail-region" aria-label="Memory details">
    <p id="choose" class="empty" data-memory-text="choose">Select a memory to view its original text.</p>
    <div id="detail" hidden><dl id="metadata"></dl><pre id="original" tabindex="0"></pre><form id="correction"><label for="corrected" data-memory-text="correction">Correction</label><textarea id="corrected" rows="5" maxlength="16384"></textarea><div class="detail-actions"><button type="submit" id="save-correction" class="primary" data-memory-text="saveCorrection">Save correction</button><button type="button" id="summarize" data-memory-text="summarize">Update index</button><button type="button" id="remove" class="danger" data-memory-text="remove">Delete memory</button></div></form></div>
   </section>
  </div>
  <section class="context-region"><div class="context-actions"><button type="button" id="used" data-memory-text="used">View used memories</button><button type="button" id="preview" data-memory-text="preview">Preview context</button></div><details id="context-details" hidden><summary id="context-label"></summary><pre id="context" tabindex="0"></pre></details></section>
 </main>
</body>
</html>

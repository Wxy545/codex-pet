<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self';style-src 'self';connect-src 'none';object-src 'none';base-uri 'none';form-action 'none'"><title>Codex Pet · Chat connections</title><link rel="stylesheet" href="panel-theme.css"><link rel="stylesheet" href="chat-connections-window.css"><script defer src="locale-en.cjs"></script><script defer src="codex-locale.cjs"></script><script defer src="panel-navigation.js"></script><script defer src="chat-connections-window.js"></script></head>
<body data-panel="connections"><main><div class="operations"><button id="new" type="button" class="primary" data-t="new">New connection</button><button id="refresh" type="button" data-t="refresh">Refresh</button><span class="badge" data-t="unverified">Unverified</span></div><p id="status" role="status" aria-live="polite"></p><div class="layout"><section class="connection-list"><ul id="connections"></ul><p id="empty" class="empty" data-t="empty">No chat connections.</p><div id="platforms"></div></section><section class="connection-form"><form id="settings"><div class="fields"><label><span data-t="label">Name</span><input id="label" maxlength="80" required></label><label><span data-t="platform">Platform</span><select id="platform"><option value="telegram">Telegram</option><option value="discord">Discord</option></select></label><label><span data-t="mode">Account type</span><select id="mode"><option value="bot" data-t="bot">Official bot</option><option value="user" data-t="user">Personal account</option></select></label><label><span data-t="application">Task app</span><select id="application"><option value="codex">Codex</option><option value="workbuddy">WorkBuddy</option><option value="harness">DeepSeek Harness</option></select></label></div><div class="credentials" id="bot-fields"><label><span data-t="token">Bot token</span><input id="bot-token" type="password" maxlength="512" autocomplete="new-password"></label></div><div class="credentials" id="user-fields" hidden><label><span>API ID</span><input id="api-id" inputmode="numeric" autocomplete="off"></label><label><span>API Hash</span><input id="api-hash" type="password" maxlength="32" autocomplete="new-password"></label></div><div class="project"><label><span data-t="project">Project</span><input id="project-label" readonly></label><button id="pick-project" type="button" data-t="pickProject">Choose folder</button></div><div class="fields"><label><span data-t="permission">Files</span><select id="permission"><option value="read-only" data-t="readOnly">Read only</option><option value="workspace-write" data-t="edit">Allow edits in project</option></select></label><label class="toggle"><input id="shell" type="checkbox"><span data-t="shell">Shell · approve each command</span></label><label class="toggle"><input id="enabled" type="checkbox" checked><span data-t="enabled">Enabled</span></label></div><div class="mcp"><button id="pick-mcp" type="button" data-t="pickMcp">Select MCP configuration</button><div id="mcp-servers"></div></div><div class="actions"><button type="submit" class="primary" data-t="save">Save connection</button><button id="guide" type="button" data-t="guide">Create account / bot</button></div></form><div id="saved-actions" class="actions" hidden><button id="connect" type="button" data-t="connect">Reconnect</button><button id="pair" type="button" data-t="pair">Pair owner</button><button id="unlink" type="button" data-t="unlink">Unpair</button><button id="disable" type="button" data-t="disable">Disconnect</button><button id="remove" type="button" class="danger" data-t="remove">Delete connection</button></div><div id="pairing" class="pairing" hidden><code id="pair-code"></code><p id="pair-expiry"></p></div><form id="login" class="login" hidden><label><span id="login-label"></span><input id="login-value" type="password" maxlength="512" autocomplete="off"></label><button type="submit" class="primary" data-t="continue">Continue</button></form></section></div></main></body></html>

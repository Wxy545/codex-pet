<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src file:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex Pet · ChatGPT</title>
  <link rel="stylesheet" href="startup-window.css">
  <link rel="stylesheet" href="startup-cinema.css">
  <link rel="stylesheet" href="startup-sheep.css">
  <link rel="stylesheet" href="startup-custom.css">
  <link rel="stylesheet" href="startup-deepseek.css">
</head>
<body>
  <main id="scene" class="scene" aria-label="ChatGPT">
    <div class="nebula" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div class="horizon" aria-hidden="true"></div>
    <div class="portal" aria-hidden="true"><i></i><i></i><i></i><div class="portal-core"></div></div>
    <div class="light-column" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div>
    <div class="character" aria-hidden="true"><div class="dragon-glow"></div><video id="dragon" muted playsinline preload="auto"></video><video id="dragon-next" muted playsinline preload="auto"></video></div>
    <div class="core" aria-hidden="true"><div class="core-halo"></div><div class="core-orbit orbit-a"></div><div class="core-orbit orbit-b"></div><div class="core-orbit orbit-c"></div><span>✧</span></div>
    <div class="masthead"><span class="sigil">✦</span><span>CODEX PET</span><span class="edition">WHITE DRAGON</span></div>
    <div class="chapter"><span id="chapter-number">01</span><span id="status" role="status"></span><i></i></div>
    <div class="wordmark"><span id="ready-label"></span><h1 id="startup-brand">ChatGPT</h1><div class="wordmark-line"></div></div>
    <div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="controls"><button id="sound" type="button" aria-pressed="false"></button><button id="skip" type="button"></button></div>
    <div class="flash" aria-hidden="true"></div><div class="blackout" aria-hidden="true"></div>
  </main>
  <script src="startup-cinema.js"></script>
  <script src="startup-sheep.js"></script>
  <script src="startup-custom.js"></script>
  <script src="startup-deepseek.js"></script>
  <script src="startup-window.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Codex Pet · Tasks</title>
  <link rel="stylesheet" href="panel-theme.css">
  <link rel="stylesheet" href="task-window.css">
  <script defer src="locale-en.cjs"></script>
  <script defer src="codex-locale.cjs"></script>
  <script defer src="panel-locale.js"></script>
  <script defer src="execution-picker.js"></script>
  <script defer src="task-window.js"></script>
</head>
<body data-panel="tasks">
  <main>
    <nav class="input-modes" aria-label="Input mode"><button id="open-chat" type="button" data-i18n="对话">Chat</button><button type="button" aria-pressed="true" data-i18n="任务">Task</button></nav>
    <form id="task-form">
      <div class="field task-field">
        <div class="field-label"><label for="task" data-i18n="任务">Task</label><span id="character-count" class="field-note">0 / 12000</span></div>
        <textarea id="task" rows="4" maxlength="12000" required autofocus></textarea>
      </div>
      <div class="field directory-field">
        <label for="directory" class="sr-only" data-i18n="工作目录">Working folder</label>
        <div class="directory-row"><input id="directory" readonly><button id="choose-directory" type="button" data-i18n="选择文件夹">Choose folder</button></div>
      </div>
      <fieldset id="permissions">
        <legend class="sr-only" data-i18n="本次权限">Permissions for this task</legend>
        <label class="permission-option"><input type="radio" name="permission" value="read-only" checked><span data-i18n="只读查看">Read only</span></label>
        <label class="permission-option"><input type="radio" name="permission" value="workspace-write"><span data-i18n="允许修改所选目录">Allow edits in this folder</span></label>
      </fieldset>
      <details id="model-settings"><summary id="model-summary">Model and reasoning</summary><fieldset id="execution-options"><div data-execution-picker></div></fieldset></details>
      <div class="confirmation" id="confirmation" aria-live="polite" hidden></div>
      <div class="actions"><button id="submit-task" class="primary" type="submit" disabled data-i18n="确认执行">Run task</button><button id="cancel-task" class="danger" type="button" hidden data-i18n="取消本次任务">Cancel task</button><button id="retry-state" type="button" hidden data-i18n="重新连接">Reconnect</button></div>
    </form>
    <section id="task-result" class="result" aria-label="Task result" data-i18n-aria="执行结果" hidden>
      <div class="result-bar"><span id="execution-state" role="status" data-i18n="尚未开始">Not started</span><button id="copy-result" type="button" disabled data-i18n="复制结果">Copy result</button></div>
      <div id="active-scope" class="active-scope" hidden></div>
      <div id="result-content" class="result-content" tabindex="0" aria-label="Task result" data-i18n-aria="执行结果">
        <ol id="progress" aria-label="Task progress" data-i18n-aria="执行进度"></ol>
        <pre id="result-text"></pre>
      </div>
    </section>
    <div id="message" class="message" role="alert" hidden></div>
  </main>
</body>
</html>
